<!DOCTYPE html?>
<head>
  <title>My Online Portfolio</title>
  <meta charset = "UTF-8">
  <meta name = "viewport" content ="width=device-width, initial-scale=1.0"> 
  <script scr="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .chart-container{
      width:90%;
      max-width:800px;
      margin:30px auto;
    }
    .image img {
      width:30%;
      border-radius:10px;
    } 
    html {
      background-color:#f0dae5;
      color:#693a51;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">My Online Portfolio</h1>
  <p style="text-align:center;">I'm Ashton Falciani. This is my portfolio.</p>
  <div style="text-align:center;" class="image">
    <img src = "https://studynewyork.us/wp-content/uploads/2024/01/Binghamton-3.jpg">
    <img src = "https://collegevine.imgix.net/fe3b77a7-d2d6-4d5d-9b9c-1eee5aebe531.jpg?fit=crop&crop=edges&auto=format&w=3275">
  </div>
  <div class = "chart-container"> 
    <canvas id = chart></canvas>
  </div>
  <script>
    const ctx=document.getElementById("Chart"); 
    new Chart(ctx,{
      type: "line",
      data: {
        labels:["Monday","Tuesday","Wednesday","Thursday","Friday"],
        datasets:[{
          label:"Coffee Spending",
          data:[6.00,12.00,12.00,18.00,18.00],

          borderColor: "#FF0145",
          backgroundColor:"#E3DCDC",
          borderWidth:3,
          fill:true,
          tension:0.35,
          pointRadius:4,
          pointBackgroundColor:"#FF0145" 
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:true,

        plugins:{
          legend:{
            display:true
          }
        }, 
        scales: {
          y:{
            beginAtZero:true
          }
        }
      }
    }); 
  </script>
</body>
</html>
