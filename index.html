<!DOCTYPE html?>
<head>
  <title>My Online Portfolio</title>
  <meta charset = "UTF-8">
  <meta name = "viewport" content ="width=device-width, initial-scale=1.0"> 
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .chart-container{
      width:90%;
      max-width:800px;
      margin:30px auto;
    }
    .image img {
      width:30%;
      border-radius:10px;
    } 
    html {
      background-color:#f0dae5;
      color:#693a51;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">My Online Portfolio</h1>
  <p style="text-align:center;">I'm Ashton Falciani. This is my portfolio.</p>
  <div style="text-align:center;" class="image">
    <img src = "https://studynewyork.us/wp-content/uploads/2024/01/Binghamton-3.jpg">
    <img src = "https://collegevine.imgix.net/fe3b77a7-d2d6-4d5d-9b9c-1eee5aebe531.jpg?fit=crop&crop=edges&auto=format&w=3275">
  </div>
  <div class = "chart-container"> 
    <canvas id = "Chart"></canvas>
    <canvas id = "Chart2"></canvas>
  </div>
  <script>
  const labels = ['8:00','8:05','8:10','8:15','8:20','8:25','8:30','8:35'];

const data = {
  labels,
  datasets: [
    {
      label: 'TikTok',
      data: [6,5,4],
      borderColor: '#cc2151',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    },
    {
      label: 'Instagram',
      data: [16,14,11,15,11,10],
      borderColor: '#9623de',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    },
    {
      label: 'Youtube',
      data: [],
      borderColor: '#9623de',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    },
    {
      label: 'Facebook',
      data: [],
      borderColor: '#9623de',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    },
    {
      label: 'Snapchat',
      data: [13,14,13,12],
      borderColor: '#135bbf',
      borderWidth: 2,
      pointRadius: 0,
      tension: 0.3
    }
  ]
};

const totalDuration = 1000; /*lower time, faster animation*/
const maxPoints = Math.max(...data.datasets.map(ds => ds.data.length));
const delayBetweenPoints = totalDuration / maxPoints;

const previousY = (ctx) => {
  if (ctx.index === 0) {
    return ctx.chart.scales.y.getPixelForValue(0);
  }

  return ctx.chart
    .getDatasetMeta(ctx.datasetIndex)
    .data[ctx.index - 1]
    .getProps(['y'], true).y;
};

const animation = {
  x: {
    type: 'number',
    easing: 'linear',
    duration: delayBetweenPoints,
    from: NaN,
    delay(ctx) {
      if (ctx.type !== 'data' || ctx.xStarted) return 0;
      ctx.xStarted = true;
      return ctx.index * delayBetweenPoints;
    }
  },
  y: {
    type: 'number',
    easing: 'linear',
    duration: delayBetweenPoints,
    from: previousY,
    delay(ctx) {
      if (ctx.type !== 'data' || ctx.yStarted) return 0;
      ctx.yStarted = true;
      return ctx.index * delayBetweenPoints;
    }
  }
};

new Chart(document.getElementById('Chart'), {
  type: 'line',
  data,
  options: {
    animation,
    interaction: {
      intersect: false
    },
    plugins: {
      legend: {
        display: true
      }
    },
    scales: {
      x: {
        type: 'category'
      },
      y: {
        beginAtZero: true
      }
    }
  }
});
     const ctx2=document.getElementById("Chart2"); 
    new Chart(ctx2,{
      type: 'doughnut',
      data: {labels: [
        'Spotify',
        'Apple Music',
        'Youtube Music'
      ],
      datasets: [{
        label: 'My First Dataset',
        data: [325, 100, 25],
        backgroundColor: [
          'rgb(60, 38, 79)',
          'rgb(42, 62, 97)',
          'rgb(125, 54, 89)'
        ],
        hoverOffset: 4
      }]},
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'top',
          },
          title: {
            display: true,
            text: 'Music Streaming Service Popularity'
          }
        }
      },
    }); 
  </script>
</body>
</html>
