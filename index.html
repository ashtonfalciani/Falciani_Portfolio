<!DOCTYPE html?>
<head>
  <title>My Online Portfolio</title>
  <meta charset = "UTF-8">
  <meta name = "viewport" content ="width=device-width, initial-scale=1.0"> 
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .chart-container{
      width:90%;
      max-width:800px;
      margin:30px auto;
    }
    .image img {
      width:30%;
      border-radius:10px;
    } 
    html {
      background-color:#f0dae5;
      color:#693a51;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">My Online Portfolio</h1>
  <p style="text-align:center;">I'm Ashton Falciani. This is my portfolio.</p>
  <div style="text-align:center;" class="image">
    <img src = "https://studynewyork.us/wp-content/uploads/2024/01/Binghamton-3.jpg">
    <img src = "https://collegevine.imgix.net/fe3b77a7-d2d6-4d5d-9b9c-1eee5aebe531.jpg?fit=crop&crop=edges&auto=format&w=3275">
  </div>
  <div class = "chart-container"> 
    <canvas id = "Chart"></canvas>
    <canvas id = "Chart2"></canvas>
  </div>
  <script>
 const labels = [
  'Instagram',
  'Facebook',
  'TikTok',
  'Snapchat'
];

const data = {
  labels: labels,
  datasets: [{
    label: 'Popularity (%)',
    data: [85, 70, 65, 45],
    backgroundColor: [
      'rgba(204, 33, 81, 0.5)',
      'rgba(150, 35, 222, 0.5)',
      'rgba(19, 91, 191, 0.5)',
      'rgba(125, 54, 89, 0.5)'
    ],
    borderWidth: 1
  }]
};

const config = {
  type: 'bar',
  data: data,
  options: {
    responsive: true,
    scales: {
      y: {
        beginAtZero: true,
        max: 100
      }
    }
  }
};

new Chart(document.getElementById('Chart'), config);
     const ctx2=document.getElementById("Chart2"); 
    new Chart(ctx2,{
      type: 'doughnut',
      data: {labels: [
        'Spotify',
        'Apple Music',
        'Youtube Music'
      ],
      datasets: [{
        label: 'My First Dataset',
        data: [325, 100, 25],
        backgroundColor: [
          'rgb(60, 38, 79)',
          'rgb(42, 62, 97)',
          'rgb(125, 54, 89)'
        ],
        hoverOffset: 4
      }]},
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'top',
          },
          title: {
            display: true,
            text: 'Music Streaming Service Popularity'
          }
        }
      },
    }); 
  </script>
</body>
</html>
